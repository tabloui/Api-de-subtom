<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subtom IA API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0d1117; color: #c9d1d9; padding: 15px;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { margin-bottom: 15px; }
  h1 { color: #58a6ff; font-size: 22px; margin-bottom: 4px; }
  .sub { color: #8b949e; font-size: 12px; }
  .chat {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 15px; height: 60vh; overflow-y: auto; margin-bottom: 10px;
  }
  .msg {
    margin-bottom: 12px; padding: 10px 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { background: #1f6feb33; border-left: 3px solid #58a6ff; }
  .msg.bot { background: #21262d; border-left: 3px solid #f0883e; }
  .msg.tool { background: #0d2a0d; border-left: 3px solid #3fb950;
              font-size: 12px; color: #7ee787; padding: 6px 12px; }
  .msg.err { background: #3a1a1a; border-left: 3px solid #f85149; color: #ff7b72; }
  .msg img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  input[type=text] {
    flex: 1; background: #0d1117; color: #c9d1d9;
    border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: #58a6ff; }
  button {
    background: #238636; color: white; border: none;
    padding: 12px 20px; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: 0.15s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #484f58; cursor: not-allowed; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick button {
    background: #21262d; padding: 8px 12px; font-size: 12px;
    font-weight: 500; color: #8b949e; border: 1px solid #30363d;
  }
  .quick button:hover { background: #30363d; color: #c9d1d9; border-color: #58a6ff; }
  .status { font-size: 11px; color: #8b949e; text-align: right; margin-top: 5px; }
  .typing { color: #8b949e; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>🤖 Subtom IA API</h1>
  <div class="sub">Controla tu teléfono, GitHub, Vercel, imágenes y más desde el chat.</div>
</header>

<div class="chat" id="chat"></div>

<div class="input-row">
  <input type="text" id="prompt" placeholder="Escribe algo..." autocomplete="off">
  <button id="send" onclick="enviar()">Enviar</button>
</div>

<div class="quick">
  <button onclick="quick('dame el estado de mi teléfono')">📱 Estado</button>
  <button onclick="quick('cuánta batería tengo')">🔋 Batería</button>
  <button onclick="quick('enciende la linterna')">🔦 Linterna</button>
  <button onclick="quick('vibra 2 segundos')">📳 Vibrar</button>
  <button onclick="quick('qué apps tengo instaladas')">📦 Apps</button>
  <button onclick="quick('dónde estoy')">📍 Ubicación</button>
  <button onclick="quick('lista mis repos de github')">🐙 Repos</button>
  <button onclick="quick('lista mis proyectos de vercel')">▲ Vercel</button>
  <button onclick="quick('busca en internet python asyncio')">🔎 Buscar</button>
</div>

<div class="status" id="status">Listo</div>

<script>
const chat = document.getElementById("chat");
const promptEl = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
let history = [];

promptEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") enviar();
});

function addMsg(text, cls = "bot") {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addImage(b64, prompt) {
  const div = document.createElement("div");
  div.className = "msg bot";
  const img = document.createElement("img");
  img.src = "data:image/png;base64," + b64;
  img.alt = prompt;
  div.appendChild(img);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quick(text) {
  promptEl.value = text;
  enviar();
}

async function enviar() {
  const prompt = promptEl.value.trim();
  if (!prompt) return;

  promptEl.value = "";
  sendBtn.disabled = true;
  statusEl.textContent = "Pensando...";

  addMsg(prompt, "user");
  const loading = addMsg("⏳ Pensando...", "bot");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, history })
    });

    const data = await res.json();
    loading.remove();

    if (data.error) {
      addMsg("❌ " + data.error, "err");
      statusEl.textContent = "Error";
      return;
    }

    if (data.tools_used && data.tools_used.length) {
      addMsg("🔧 Herramientas: " + data.tools_used.join(", "), "tool");
    }

    addMsg(data.response || "(sin respuesta)", "bot");
    history = data.history || [];
    statusEl.textContent = "Listo";
  } catch (e) {
    loading.remove();
    addMsg("❌ Error de red: " + e.message, "err");
    statusEl.textContent = "Error";
  } finally {
    sendBtn.disabled = false;
    promptEl.focus();
  }
}

// Mensaje de bienvenida
addMsg("¡Hola! Soy Subtom IA. Puedo controlar tu teléfono, GitHub, Vercel, generar imágenes y mucho más. ¿Qué necesitas?", "bot");
</script>

</body>
</html>
